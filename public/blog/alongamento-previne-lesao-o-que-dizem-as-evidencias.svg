      <text x="0" y="102" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">MENOS LESÕES,</text>
      <text x="0" y="122" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">MAIS SAÚDE E</text>
      <text x="0" y="142" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">QUALIDADE DE VIDA</text>
    </g>
  </g>

  <rect x="42" y="548" width="310" height="160" rx="18" fill="url(#teal)"/>
  <circle cx="92" cy="622" r="30" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M92 602v18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M81 620c0-6 5-10 11-10s11 4 11 10" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
