      <text x="0" y="122" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">E MOBILIDADE</text>
      <text x="0" y="142" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">FUNCIONAL</text>
    </g>

    <g transform="translate(394 0)">
