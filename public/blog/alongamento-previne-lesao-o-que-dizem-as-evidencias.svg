  <text x="78" y="166" fill="url(#teal)" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.4">ALONGAMENTO</text>
  <text x="78" y="229" fill="#0E4A50" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.4">PREVINE LESÃO?</text>
  <text x="78" y="280" fill="#155F67" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1.2">O QUE AS EVIDÊNCIAS DIZEM SOBRE?</text>

  <rect x="78" y="301" width="70" height="4" rx="2" fill="#0F9D9A"/>

  <text x="78" y="357" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">
    <tspan x="78" dy="0">A ciência mostra que alongamento sozinho não é o</tspan>
    <tspan x="78" dy="28">principal fator de prevenção. Força, controle e carga</tspan>
    <tspan x="78" dy="28">adequada fazem mais diferença no risco de lesão.</tspan>
  </text>

  <g transform="translate(78 405)" opacity="0.95">
    <g>
      <circle cx="28" cy="28" r="28" fill="#EEF9F8" stroke="#D8EEEE"/>
      <path d="M18 18h20v20H18z" stroke="#0F6D72" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M21 21h14M21 26h14M21 31h10" stroke="#0F6D72" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="0" y="102" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">BASEADO EM</text>
    <text x="0" y="122" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">EVIDÊNCIAS</text>
    <text x="0" y="142" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">CIENTÍFICAS</text>

    <g transform="translate(120 0)">
