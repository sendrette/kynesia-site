      <text x="0" y="102" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">PREVENÇÃO</text>
      <text x="0" y="122" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">INTELIGENTE</text>
      <text x="0" y="142" fill="#29444A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">E INDIVIDUALIZADA</text>
    </g>

    <g transform="translate(242 0)">
