    </g>
    <g transform="translate(118 28)">
      <text x="0" y="18" fill="#0E4A50" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">FLEXIBILIDADE IMPORTA</text>
      <text x="0" y="50" fill="#41595F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">Melhora amplitude, reduz rigidez e</text>
      <text x="0" y="72" fill="#41595F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">promove bem-estar.</text>
    </g>
    <g transform="translate(308 28)">
      <text x="0" y="18" fill="#0E4A50" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">FORÇA É FUNDAMENTAL</text>
      <text x="0" y="50" fill="#41595F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">Tecidos fortes suportam mais carga</text>
      <text x="0" y="72" fill="#41595F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">e têm menor risco de lesão.</text>
    </g>
    <g transform="translate(30 96)">
      <text x="0" y="18" fill="#0E4A50" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">CARGA BEM GERENCIADA</text>
      <text x="0" y="50" fill="#41595F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">A progressão adequada é um dos</text>
      <text x="0" y="72" fill="#41595F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">principais fatores de prevenção.</text>
    </g>
    <g transform="translate(314 96)">
      <text x="0" y="18" fill="#0E4A50" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">MOBILIDADE COM CONTROLE</text>
      <text x="0" y="50" fill="#41595F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">Mais do que alongar, é preciso</text>
      <text x="0" y="72" fill="#41595F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">mover bem e com estabilidade.</text>
    </g>
  </g>

