  <text x="138" y="586" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Alongamento tem</text>
  <text x="138" y="617" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">seu valor, mas não é</text>
  <text x="138" y="648" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">milagroso.</text>
  <text x="138" y="678" fill="#CFF7F4" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">O equilíbrio é</text>
  <text x="138" y="709" fill="#CFF7F4" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">o que protege.</text>

  <g transform="translate(378 548)">
